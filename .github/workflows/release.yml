# Builds the release APK and, for a version tag (v1.2.3), publishes it as a GitHub Release.
#
#   git tag v1.2.3 && git push origin v1.2.3     -> signed APK attached to a new release
#   Actions tab > "Release APK" > Run workflow   -> test build, APK kept as a workflow artifact only
#
# Signing needs four repository secrets (set them once with tools\set-release-secrets.ps1):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# A tag build fails without them; a manual run without them produces an UNSIGNED test APK.
# The tag must match versionName in app/build.gradle.kts (v1.1.0 <-> "1.1.0").
name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Read the version (and check it against the tag)
        id: version
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -n1)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$name" ] || [ -z "$code" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$name" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $name in app/build.gradle.kts. Bump the version, commit, and tag again."
            exit 1
          fi
          echo "Building Volt $name (versionCode $code)"

      - name: Install NDK and CMake
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;3.22.1" "platforms;android-36"

      - name: Prepare the signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::The signing secrets are not set (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Run tools/set-release-secrets.ps1, then publish the tag again."
              exit 1
            fi
            echo "::warning::No signing secrets: this is an UNSIGNED test build, not installable."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the release APK
        env:
          VOLT_STORE_FILE: ${{ steps.sign.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          VOLT_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOLT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOLT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the signature and collect the files
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk)
          mkdir dist
          if [ "$SIGNED" = "true" ]; then
            apksigner=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -n1)
            "$apksigner" verify --print-certs "$src" | tee certs.txt
            dest="volt-$VERSION.apk"
          else
            dest="volt-$VERSION-unsigned.apk"
          fi
          cp "$src" "dist/$dest"
          (cd dist && sha256sum "$dest" > "$dest.sha256" && cat "$dest.sha256")
          {
            echo "### $dest"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "dist/$dest.sha256")\`"
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signing certificate:"
              echo
              echo '```'
              grep "certificate SHA-256" certs.txt
              echo '```'
            else
              echo "**Unsigned** test build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: volt-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: volt-apk
          path: dist

      - name: Create (or update) the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "APK assinado para instalação direta (sideload). Requer Android 8.0 ou mais novo (arm64 ou x86_64)."
            echo "Confira o arquivo \`.sha256\` anexado. O APK não traz os cartuchos de fábrica do DX7 (dados da Yamaha): use **Importar** com os seus \`.syx\`, veja \`docs/DX7-CARTUCHOS.md\`."
            echo
            gh api -X POST "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body
          } > notes.md
          flags=""
          if [[ "$TAG" == *-* ]]; then flags="--prerelease"; fi
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "Volt $TAG" --notes-file notes.md $flags
          fi
